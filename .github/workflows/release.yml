# Gera e publica uma versão nova quando uma tag vX.Y.Z é enviada:
#   git tag v0.2.0 && git push origin v0.2.0
# A versão em app/package.json precisa ser a mesma da tag.
# O app instalado procura atualização nas Releases (electron-updater; no celular, o APK).

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  VITE_DEFAULT_SERVER: https://resenha.lucaslomiento.workers.dev
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Versão do app bate com a tag
        run: test "v$(node -p "require('./app/package.json').version")" = "$GITHUB_REF_NAME"
      - name: Cria a release como rascunho
        run: gh release create "$GITHUB_REF_NAME" --draft --title "Resenha ${GITHUB_REF_NAME#v}" --notes-file RELEASE_NOTES.md

  # O librespot do bot do Spotify no Windows (vem do cache; compila só se não tiver).
  librespot:
    uses: ./.github/workflows/librespot-windows.yml

  build:
    needs: [draft, librespot]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            targets: --linux pacman AppImage
          - os: windows-latest
            targets: --win nsis zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Ferramentas do pacote pacman
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools zstd
      # Sem scripts de instalação: o Electron do empacotamento é baixado pelo
      # electron-builder, e o venmic já vem com o binário pronto no pacote npm.
      # No Windows o --force passa por cima do "venmic é só Linux" (lá ele nem é usado).
      - run: npm ci --ignore-scripts ${{ runner.os == 'Windows' && '--force' || '' }}
      - name: librespot do bot do Spotify (Windows)
        if: runner.os == 'Windows'
        uses: actions/download-artifact@v4
        with:
          name: librespot-win
          path: app/resources/win
      - name: Gera e envia pra release
        working-directory: app
        shell: bash
        run: npx electron-vite build && npx electron-builder ${{ matrix.targets }} --publish always

  # App de Android: a mesma interface no Capacitor, APK assinado com a chave do Resenha
  # (secrets ANDROID_KEYSTORE, em base64, e ANDROID_KEYSTORE_PASSWORD: mobile/scripts/android-key.sh).
  # O push liga sozinho quando o mobile/android/app/google-services.json existe.
  android:
    needs: draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --ignore-scripts
      - name: Chave de assinatura
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          test -n "$KEYSTORE" || { echo "::error::Falta o secret ANDROID_KEYSTORE (rode mobile/scripts/android-key.sh)"; exit 1; }
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/resenha.keystore"
      - name: Interface do celular
        run: npm -w app run build:mobile && (cd mobile && npx cap sync android)
      - name: APK assinado
        working-directory: mobile/android
        env:
          RESENHA_KEYSTORE: ${{ runner.temp }}/resenha.keystore
          RESENHA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon
      - name: Envia pra release
        run: |
          apk="Resenha-${GITHUB_REF_NAME#v}.apk"
          cp mobile/android/app/build/outputs/apk/release/app-release.apk "$apk"
          gh release upload "$GITHUB_REF_NAME" "$apk"

  publish:
    needs: [build, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v5
      - name: Publica a release (é aqui que os apps instalados enxergam a versão nova)
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
      # O site mostra as novidades e os links da versão nova (roda pela main).
      - name: Atualiza o site
        run: gh workflow run site.yml --ref main
